[package]
name = "wt-core-sources-standalone"
version = "0.1.0"
edition = "2021"
publish = false

# Keep out of the engine-rs workspace (coordinator owns workspace.members).
[workspace]

[dependencies]
wt-types = { path = "../../../wt-types" }
wt-discovery = { path = "../../../wt-discovery" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mainline = { version = "8", default-features = false, features = ["async"] }
